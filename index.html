<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="A focused, modern calculator by Fahry Achmad.">
  <title>Calculator — Fahry Achmad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Orbit calculator home">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>orbit<span class="brand-light">.calc</span></span>
      </a>
      <div class="creator-badge"><span class="status-dot" aria-hidden="true"></span><span>Created by <strong>Fahry Achmad</strong></span></div>
    </header>

    <section class="stage" aria-label="Calculator">
      <div class="intro">
        <p class="eyebrow"><span></span> YOUR SPACE TO CALCULATE</p>
        <h1>Make it <span>add up.</span></h1>
        <p class="intro-copy">A little clarity, one calculation at a time.</p>
      </div>

      <div class="calculator-card">
        <div class="card-topline"><span class="card-label">STANDARD</span><span class="live-indicator"><span></span> READY</span></div>
        <div class="output" aria-live="polite" aria-atomic="true">
          <div class="expression-line"><span class="expression-label">EXPRESSION</span><div data-previous-operand class="previous-operand"></div></div>
          <div class="result-line"><span class="result-label">RESULT</span><div data-current-operand class="current-operand">0</div></div>
        </div>
        <div class="keypad" aria-label="Calculator keypad">
          <button class="key key-utility" data-all-clear aria-label="All clear">AC</button>
          <button class="key key-utility key-delete" data-delete aria-label="Delete last digit">DEL</button>
          <button class="key key-operator" data-operation="÷" aria-label="Divide">÷</button>
          <button class="key key-operator" data-operation="*" aria-label="Multiply">×</button>
          <button class="key" data-number="7">7</button><button class="key" data-number="8">8</button><button class="key" data-number="9">9</button><button class="key key-operator" data-operation="-" aria-label="Subtract">−</button>
          <button class="key" data-number="4">4</button><button class="key" data-number="5">5</button><button class="key" data-number="6">6</button><button class="key key-operator" data-operation="+" aria-label="Add">+</button>
          <button class="key" data-number="1">1</button><button class="key" data-number="2">2</button><button class="key" data-number="3">3</button>
          <button class="key key-zero" data-number="0">0</button><button class="key" data-number="." aria-label="Decimal point">.</button>
          <button class="key key-equals" data-equals aria-label="Equals">=</button>
        </div>
        <footer class="card-footer"><span><kbd>⌨</kbd> Keyboard supported</span><span>ESC <i>to clear</i></span></footer>
      </div>
      <p class="stage-note">Thoughtfully simple. <span>Precisely yours.</span></p>
    </section>
    <footer class="page-footer"><span>© <span data-year></span> Fahry Achmad</span><span>DESIGNED FOR CLARITY <i></i></span></footer>
  </main>
</body>
</html>
